<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chiaro</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a;padding:18px 16px 84px}
    .wrap{max-width:620px;margin:0 auto}
    h1{font-size:24px;margin:6px 0}
    .sub{color:#64748b;font-size:14px;margin:0 0 18px}
    .btn-card{width:100%;text-align:left;padding:16px;border-radius:14px;border:1px solid #e2e8f0;background:#fff;margin-bottom:12px;font-size:15px;cursor:pointer}
    .btn-primary{background:#1a56db;color:#fff;border:none;font-weight:700}
    .box{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:12px}
    textarea{width:100%;min-height:110px;border:1px solid #cbd5e1;border-radius:12px;padding:12px;font-size:15px;box-sizing:border-box;margin:10px 0}
    .btn{width:100%;padding:14px;border-radius:12px;border:none;background:#1a56db;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
    .btn-sec{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;margin-top:8px}
    .back{background:none;border:none;font-size:15px;font-weight:700;padding:0 0 10px;cursor:pointer;color:#0f172a}
    .lbl{font-size:11px;font-weight:800;color:#64748b;margin-bottom:4px}
    .nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;padding:10px 0}
    .nav button{background:none;border:none;font-size:13px;font-weight:700;color:#64748b;cursor:pointer}
    .nav button.on{color:#1a56db}
    .hidden{display:none}
    .msg{background:#fef3c7;color:#92400e;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
  </style>
</head>
<body>
<div class="wrap">
  <div id="errBox" class="msg hidden"></div>

  <div id="v-home">
    <div style="font-weight:800;color:#1a56db">Chiaro</div>
    <h1>Cosa vuoi chiarire oggi?</h1>
    <p class="sub">Documenti, bollette, lettere e dubbi in parole semplici.</p>
    <button class="btn-card btn-primary" id="goDoc">📄 Ho ricevuto un documento<br><span style="font-weight:400;font-size:13px">Foto o testo del documento</span></button>
    <button class="btn-card" id="goDubbio">💬 Chiedi un dubbio quotidiano<br><span style="font-weight:400;font-size:13px;color:#64748b">Regole, costi, reclami o primi passi</span></button>
    <div class="lbl" style="margin-top:16px">PROSSIME SCADENZE</div>
    <div id="homeScad" class="box" style="color:#64748b;font-size:14px">Nessuna scadenza salvata.</div>
  </div>

  <div id="v-input" class="hidden">
    <button class="back" id="back1">← Indietro</button>
    <h1 id="inTitle">Analizza</h1>
    <div id="fotoWrap" class="hidden">
      <input type="file" accept="image/*" capture="environment" id="fotoInput" />
      <img id="fotoPrev" style="max-width:100%;max-height:180px;margin-top:8px;border-radius:10px;display:none" />
    </div>
    <textarea id="inTxt" placeholder="Scrivi qui il tuo dubbio o incolla il testo..."></textarea>
    <button class="btn" id="btnRun">Spiegamelo in parole semplici</button>
  </div>

  <div id="v-res" class="hidden">
    <button class="back" id="back2">← Home</button>
    <div id="rCat" style="font-size:12px;font-weight:700;color:#1a56db"></div>
    <h1 id="rTit"></h1>
    <div class="box"><div class="lbl">1. IN PAROLE SEMPLICI</div><div id="rSem"></div></div>
    <div class="box"><div class="lbl">2. COSA SIGNIFICA PER TE</div><div id="rImp"></div></div>
    <div class="box"><div class="lbl">3. SCADENZA E URGENZA</div><div id="rSca"></div></div>
    <div class="box"><div class="lbl">4. PROSSIMO PASSO</div><div id="rPas"></div></div>
    <div id="rAzBox" class="box hidden" style="background:#eff6ff;border-color:#bfdbfe">
      <div class="lbl" style="color:#1e40af">AZIONE PRONTA</div>
      <div id="rAzTxt" style="white-space:pre-wrap;font-size:14px;margin-bottom:8px"></div>
      <button class="btn btn-sec" id="btnCopy">Copia testo</button>
    </div>
    <button class="btn" id="btnSave">Salva in Archivio e Scadenze</button>
  </div>

  <div id="v-scad" class="hidden">
    <h1>Scadenze</h1>
    <div id="listScad"></div>
  </div>

  <div id="v-arc" class="hidden">
    <h1>Archivio</h1>
    <div id="listArc"></div>
  </div>
</div>

<div class="nav">
  <button id="nHome" class="on">🏠 Home</button>
  <button id="nScad">📅 Scadenze</button>
  <button id="nArc">🗂️ Archivio</button>
</div>

<script>
(function(){
  const KEY="chiaro_v1", URL="/.netlify/functions/analizza-chiaro";
  let items=[]; try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}
  let cur=null, b64=null, mime="image/jpeg";

  const showErr=(m)=>{const el=document.getElementById("errBox");el.textContent=m;el.classList.remove("hidden")};
  const clearErr=()=>document.getElementById("errBox").classList.add("hidden");
  const views=["v-home","v-input","v-res","v-scad","v-arc"];
  const openView=(id)=>{clearErr();views.forEach(v=>document.getElementById(v).classList.toggle("hidden",v!==id))};
  const setTab=(btnId)=>{["nHome","nScad","nArc"].forEach(b=>document.getElementById(b).classList.toggle("on",b===btnId))};

  const renderHome=()=>{
    const sc=items.filter(x=>!x.fatto);
    document.getElementById("homeScad").innerHTML=sc.length
      ? sc.slice(0,3).map(x=>"<b>"+x.titolo+"</b> · "+(x.scadenza_testo||"")).join("<br>")
      : "Nessuna scadenza attiva.";
  };

  document.getElementById("goDoc").onclick=()=>{
    b64=null; document.getElementById("fotoInput").value=""; document.getElementById("fotoPrev").style.display="none";
    document.getElementById("inTxt").value=""; document.getElementById("fotoWrap").classList.remove("hidden");
    document.getElementById("inTitle").textContent="Analizza un documento"; openView("v-input");
  };
  document.getElementById("goDubbio").onclick=()=>{
    b64=null; document.getElementById("inTxt").value=""; document.getElementById("fotoWrap").classList.add("hidden");
    document.getElementById("inTitle").textContent="Chiedi un dubbio"; openView("v-input");
  };
  document.getElementById("back1").onclick=()=>{openView("v-home");setTab("nHome");renderHome()};
  document.getElementById("back2").onclick=()=>{openView("v-home");setTab("nHome");renderHome()};

  document.getElementById("fotoInput").onchange=(e)=>{
    const f=e.target.files&&e.target.files[0]; if(!f)return; mime=f.type||"image/jpeg";
    const r=new FileReader();
    r.onload=()=>{const res=String(r.result||""); b64=res.split(",")[1]||null; const img=document.getElementById("fotoPrev"); img.src=res; img.style.display="block"};
    r.readAsDataURL(f);
  };

  document.getElementById("btnRun").onclick=async()=>{
    const testo=document.getElementById("inTxt").value.trim();
    if(!testo&&!b64){showErr("Scrivi un dubbio o scegli una foto.");return}
    const btn=document.getElementById("btnRun"); btn.disabled=true; btn.textContent="Sto elaborando..."; clearErr();
    try{
      const r=await fetch(URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({testo,immagineBase64:b64,mimeType:mime})});
      const d=await r.json();
      if(!r.ok||d.error)throw new Error(d.error||"Errore server");
      cur={id:String(Date.now()),fatto:false,...d};
      renderRes(cur);
    }catch(err){
      showErr("Errore analisi: "+err.message+". Verifica GEMINI_API_KEY su Netlify e riprova.");
    }finally{
      btn.disabled=false; btn.textContent="Spiegamelo in parole semplici";
    }
  };

  function renderRes(d){
    openView("v-res");
    document.getElementById("rCat").textContent=(d.categoria||"Generale")+" · Urgenza: "+(d.urgenza||"Nessuna");
    document.getElementById("rTit").textContent=d.titolo||"Chiarimento";
    document.getElementById("rSem").textContent=d.in_parole_semplici||"";
    document.getElementById("rImp").textContent=d.cosa_significa_per_te||"";
    document.getElementById("rSca").textContent=d.scadenza_testo||"Nessuna scadenza fissa";
    const passi=Array.isArray(d.prossimo_passo)?d.prossimo_passo:[];
    document.getElementById("rPas").innerHTML=passi.map(p=>"• "+p).join("<br>")||"—";
    const az=d.azione_pronta&&d.azione_pronta.testo_copiabile;
    document.getElementById("rAzBox").classList.toggle("hidden",!az);
    if(az)document.getElementById("rAzTxt").textContent=d.azione_pronta.testo_copiabile;
  }

  document.getElementById("btnCopy").onclick=async()=>{
    const txt=document.getElementById("rAzTxt").textContent;
    try{await navigator.clipboard.writeText(txt);alert("Testo copiato!")}catch(e){alert("Copia il testo dal riquadro.")}
  };

  document.getElementById("btnSave").onclick=()=>{
    if(!cur)return;
    items.unshift(cur);
    localStorage.setItem(KEY,JSON.stringify(items));
    alert("Salvato!");
  };

  document.getElementById("nHome").onclick=()=>{setTab("nHome");renderHome();openView("v-home")};
  document.getElementById("nScad").onclick=()=>{
    setTab("nScad"); openView("v-scad");
    const el=document.getElementById("listScad");
    el.innerHTML=items.length?items.map((x,i)=>"<div class='box'><label><input type='checkbox' "+(x.fatto?"checked":"")+" data-i='"+i+"'> <b>"+x.titolo+"</b></label><div style='font-size:13px;color:#64748b'>"+(x.scadenza_testo||"")+"</div></div>").join(""):"<div class='box'>Nessuna scadenza.</div>";
    el.querySelectorAll("input[type=checkbox]").forEach(cb=>{
      cb.onchange=()=>{items[cb.dataset.i].fatto=cb.checked;localStorage.setItem(KEY,JSON.stringify(items))};
    });
  };
  document.getElementById("nArc").onclick=()=>{
    setTab("nArc"); openView("v-arc");
    const el=document.getElementById("listArc");
    el.innerHTML=items.length?items.map((x,i)=>"<div class='box' data-a='"+i+"'><b>"+x.titolo+"</b><div style='font-size:13px;color:#64748b'>"+(x.categoria||"")+"</div></div>").join(""):"<div class='box'>Archivio vuoto.</div>";
    el.querySelectorAll("[data-a]").forEach(row=>{
      row.onclick=()=>{cur=items[row.dataset.a];renderRes(cur)};
    });
  };

  renderHome();
})();
</script>
</body>
</html>
